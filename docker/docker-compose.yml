version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: service-base-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: servicebasedb
    ports:
      - "5432:5432"
    volumes:
      - service-base-data:/var/lib/postgresql/data

volumes:
  service-base-data: