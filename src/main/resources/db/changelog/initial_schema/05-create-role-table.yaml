databaseChangeLog:
  - changeSet:
      id: 05
      author: rafaelcampos
      changes:
        - createTable:
            tableName: tb_role
            schemaName: auth
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true